<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ghi chú cá nhân</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Theme mặc định của Docsify -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Đang tải...</div>
  <script>
    window.$docsify = {
      name: 'My Notes',
      repo: '', // Có thể điền link repo GitHub nếu muốn hiển thị icon góc phải
      loadSidebar: true, // Bật sidebar
      subMaxLevel: 3,    // Tự gom các thẻ h2, h3 trong bài viết vào mục lục
      search: 'auto'     // Bật ô tìm kiếm
    }
  </script>
  <!-- Các script thư viện chạy trực tiếp qua CDN (không cần cài vào máy) -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
